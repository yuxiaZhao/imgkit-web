<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgkit - 前端图片处理工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <header class="header">
            <h1 class="logo">imgkit</h1>
            <p class="subtitle">前端图片处理工具 · 轻量、高效、开箱即用</p>
        </header>


        <main class="main-content">

            <div class="left-panel">

                <section class="section upload-section">
                    <h2 class="section-title">
                        <span class="title-number">1</span>
                        添加图片
                    </h2>
                    <div class="upload-area">
                        <div class="upload-placeholder">
                            <p>点击或拖拽图片到此处上传</p>
                        </div>
                    </div>
                </section>


                <section class="section export-section">
                    <h2 class="section-title">
                        <span class="title-number">3</span>
                        导出设置
                    </h2>
                    <div class="export-content">
                        <p class="export-hint">选择格式和质量，一键导出处理后的图片</p>
                    </div>
                </section>
            </div>


            <div class="right-panel">
                <section class="section params-section">
                    <h2 class="section-title">
                        <span class="title-number">2</span>
                        参数调整
                    </h2>


                    <div class="tabs">
                        <button class="tab active">基本</button>
                        <button class="tab">高级</button>
                        <button class="tab">水印</button>
                        <button class="tab">边框</button>
                        <button class="tab">裁剪</button>
                        <button class="tab">滤镜</button>
                    </div>


                    <div class="tab-content active" id="tab-basic">

                        <div class="control-group">
                            <label class="control-label">
                                <input type="checkbox" checked>
                                <span>图片调整</span>
                            </label>

                            <div class="control-items">

                                <div class="control-item">
                                    <div class="control-header">
                                        <span class="control-name">宽度</span>
                                        <span class="control-value">1920 px</span>
                                    </div>
                                    <input type="range" class="slider" min="100" max="4000" value="1920">
                                </div>

                                <div class="control-item">
                                    <div class="control-header">
                                        <span class="control-name">高度</span>
                                        <span class="control-value">1080 px</span>
                                    </div>
                                    <input type="range" class="slider" min="100" max="4000" value="1080">
                                </div>
                            </div>
                        </div>

                        <button class="btn-primary">应用设置</button>
                    </div>

                    <div class="tab-content" id="tab-advanced">
                        <div class="control-group">
                            <label class="control-label">
                                <input type="checkbox">
                                <span>质量压缩</span>
                            </label>
                            <div class="control-items">
                                <div class="control-item">
                                    <div class="control-header">
                                        <span class="control-name">质量</span>
                                        <span class="control-value">85 %</span>
                                    </div>
                                    <input type="range" class="slider" min="1" max="100" value="85">
                                </div>
                            </div>
                        </div>
                        <button class="btn-primary">应用设置</button>
                    </div>

                    <div class="tab-content" id="tab-watermark">
                        <div class="control-group">
                            <label class="control-label">
                                <input type="checkbox">
                                <span>文字水印</span>
                            </label>
                            <div class="control-items">
                                <div class="control-item input-item">
                                    <label class="control-name">水印文字</label>
                                    <input type="text" class="text-input" placeholder="请输入水印文字">
                                </div>
                                <div class="control-item input-item">
                                    <label class="control-name">字体大小</label>
                                    <input type="number" class="text-input" value="24" placeholder="24">
                                </div>
                                <div class="control-item">
                                    <div class="control-header">
                                        <span class="control-name">透明度</span>
                                        <span class="control-value">50 %</span>
                                    </div>
                                    <input type="range" class="slider" min="0" max="100" value="50">
                                </div>
                                <div class="control-item select-item">
                                    <label class="control-name">位置</label>
                                    <select class="select-input">
                                        <option>右下角</option>
                                        <option>左下角</option>
                                        <option>右上角</option>
                                        <option>左上角</option>
                                        <option>居中</option>
                                    </select>
                                </div>
                                <div class="control-item select-item">
                                    <label class="control-name">颜色</label>
                                    <select class="select-input">
                                        <option>白色</option>
                                        <option>黑色</option>
                                        <option>红色</option>
                                        <option>蓝色</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button class="btn-primary">应用设置</button>
                    </div>


                    <div class="tab-content" id="tab-border">
                        <div class="control-group">
                            <label class="control-label">
                                <input type="checkbox">
                                <span>边框效果</span>
                            </label>
                            <div class="control-items">
                                <div class="control-item input-item">
                                    <label class="control-name">边框宽度</label>
                                    <input type="number" class="text-input" value="5" placeholder="5">
                                </div>
                                <div class="control-item select-item">
                                    <label class="control-name">边框样式</label>
                                    <select class="select-input">
                                        <option>实线</option>
                                        <option>虚线</option>
                                        <option>点线</option>
                                    </select>
                                </div>
                                <div class="control-item input-item">
                                    <label class="control-name">圆角半径</label>
                                    <input type="number" class="text-input" value="0" placeholder="0">
                                </div>
                                <div class="control-item select-item">
                                    <label class="control-name">颜色</label>
                                    <select class="select-input">
                                        <option>黑色</option>
                                        <option>白色</option>
                                        <option>红色</option>
                                        <option>蓝色</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button class="btn-primary">应用设置</button>
                    </div>


                    <div class="tab-content" id="tab-crop">
                        <div class="control-group">
                            <label class="control-label">
                                <input type="checkbox">
                                <span>裁剪设置</span>
                            </label>
                            <div class="control-items">
                                <div class="control-item select-item">
                                    <label class="control-name">裁剪比例</label>
                                    <select class="select-input">
                                        <option>自由裁剪</option>
                                        <option>1:1</option>
                                        <option>4:3</option>
                                        <option>16:9</option>
                                        <option>3:4</option>
                                    </select>
                                </div>
                                <div class="control-item input-item">
                                    <label class="control-name">宽度 (px)</label>
                                    <input type="number" class="text-input" placeholder="自动">
                                </div>
                                <div class="control-item input-item">
                                    <label class="control-name">高度 (px)</label>
                                    <input type="number" class="text-input" placeholder="自动">
                                </div>
                            </div>
                        </div>
                        <button class="btn-primary">应用设置</button>
                    </div>


                    <div class="tab-content" id="tab-filter">
                        <div class="control-group">
                            <label class="control-label">
                                <input type="checkbox">
                                <span>滤镜效果</span>
                            </label>
                            <div class="control-items">
                                <div class="control-item select-item">
                                    <label class="control-name">预设滤镜</label>
                                    <select class="select-input">
                                        <option>原图</option>
                                        <option>灰度</option>
                                        <option>复古</option>
                                        <option>明亮</option>
                                        <option>对比度增强</option>
                                    </select>
                                </div>
                                <div class="control-item">
                                    <div class="control-header">
                                        <span class="control-name">亮度</span>
                                        <span class="control-value">0</span>
                                    </div>
                                    <input type="range" class="slider" min="-100" max="100" value="0">
                                </div>
                                <div class="control-item">
                                    <div class="control-header">
                                        <span class="control-name">对比度</span>
                                        <span class="control-value">0</span>
                                    </div>
                                    <input type="range" class="slider" min="-100" max="100" value="0">
                                </div>
                                <div class="control-item">
                                    <div class="control-header">
                                        <span class="control-name">饱和度</span>
                                        <span class="control-value">0</span>
                                    </div>
                                    <input type="range" class="slider" min="-100" max="100" value="0">
                                </div>
                            </div>
                        </div>
                        <button class="btn-primary">应用设置</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
